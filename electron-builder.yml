appId: local.panasonic-rcp
productName: AG-CX370 CCU
directories:
  output: dist
files:
  - src/**/*
  - package.json
# The x64 NDI helper and NDI's x64 DLL (run under emulation: NDI has no
# Windows ARM64 library). Build them first with "npm run build:ndi-helper".
extraResources:
  - from: native/ndi-helper/build
    to: ndi-helper
    filter:
      - ndi-helper.exe
      - Processing.NDI.Lib.x64.dll
      - Processing.NDI.Lib.Licenses.txt
# Native modules can't load from inside the asar archive.
asarUnpack:
  - "**/*.node"
win:
  # Generated from build/icon.svg by "npm run build:icons".
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - arm64
  # Signing (Phase 5): set up Authenticode (e.g. Azure Trusted Signing) here.
nsis:
  # Pack the app as zip, not 7z. On an ARM64 build machine electron-builder's
  # 7-Zip (24.x) applies its ARM64 filter to ARM64 .exe/.dll files, which the
  # installer's extractor can't decode: it silently skipped them, so the app
  # exe was missing after install and the shortcuts pointed at nothing.
  # useZip only takes effect with differential packages off; those exist for
  # auto-update, which this app doesn't use.
  useZip: true
  differentialPackage: false
  # One-click, per-user: installs to %LOCALAPPDATA%\Programs with no prompts and
  # no admin rights, adds desktop and Start menu shortcuts, then launches.
  # (An all-users install would land in "Program Files (x86)": the 32-bit
  # installer doesn't treat ARM64 Windows as 64-bit.)
  oneClick: true
  perMachine: false
